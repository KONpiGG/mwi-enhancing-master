<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>强化大师</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><h1>强化大师</h1><p>用卖一买入、买一卖出的保守期望值排行榜</p></div><button id="update">更新市场数据</button></header>
<section class="controls"><label>玩家强化等级 <input id="player" type="number" min="0" max="200" value="0"></label><label>排序 <select id="sort"><option value="profit">预计利润</option><option value="loss">最低亏损</option><option value="costPerExperience">每点经验成本</option><option value="totalExperience">总经验</option><option value="volume">成交量</option></select></label><label>最低经验 <input id="minXp" type="number" min="0" value="0"></label><label>最大允许亏损 <input id="maxLoss" type="number" min="0" placeholder="不限"></label><label>最低成交量 <input id="minVolume" type="number" min="0" value="0"></label><label>最大资金需求 <input id="maxCapital" type="number" min="0" placeholder="不限"></label><label>起始强化 ≥ <input id="minLevel" type="number" min="0" value="0"></label><label>目标强化 ≤ <input id="maxLevel" type="number" min="1" value="5"></label></section>
<p id="status"></p><div class="table-wrap"><table><thead><tr><th>项目</th><th>最终成功率</th><th>预计尝试</th><th>总经验</th><th>购买成本</th><th>出售收入</th><th>利润/亏损</th><th>每点经验</th><th>资金占用</th><th>成交量</th><th>价差</th><th>风险</th></tr></thead><tbody id="rows"></tbody></table></div><section id="detail" class="detail" hidden></section>
</main><script type="module" src="app.js"></script></body></html>
