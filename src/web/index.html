<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>强化大师</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><h1>强化大师</h1><p>选择装备与强化区间，同时查看官方市场报价</p></div><button id="update">更新市场数据</button></header>
<nav><button class="tab active" data-panel="projects">强化项目</button><button class="tab" data-panel="market">市场报价</button></nav>
<section id="projects" class="panel"><h2>强化设置</h2><section class="controls"><label class="wide">要强化的装备 <select id="item"><option value="">全部装备</option></select></label><label>起始强化 <input id="minLevel" type="number" min="0" value="0"></label><label>目标强化 <input id="maxLevel" type="number" min="1" value="10"></label><label>玩家强化等级 <input id="player" type="number" min="0" max="200" value="100"></label><label>装备提供强化等级 <input id="levelBonus" type="number" value="0"></label><label>装备成功率（%） <input id="equipmentSuccess" type="number" step="0.01" value="0"></label><label>社区 Buff 成功率（%） <input id="communitySuccess" type="number" step="0.01" value="0"></label><label>成就成功率（%） <input id="achievementSuccess" type="number" step="0.01" value="0"></label><label>神龙/祭坛成功率（%） <input id="shrineSuccess" type="number" step="0.01" value="0"></label><label>经验总加成（%） <input id="experienceBonus" type="number" step="0.01" value="0"></label><label>市场手续费（%） <input id="fee" type="number" min="0" max="99.99" step="0.01" value="0"></label><label>排序 <select id="sort"><option value="profit">预计利润</option><option value="loss">最低亏损</option><option value="costPerExperience">每点经验成本</option><option value="totalExperience">总经验</option><option value="volume">成交量</option></select></label><label>最低经验 <input id="minXp" type="number" min="0" value="0"></label><label>最大允许亏损 <input id="maxLoss" type="number" min="0" placeholder="不限"></label><label>最低成交量 <input id="minVolume" type="number" min="0" value="0"></label><label>最大资金需求 <input id="maxCapital" type="number" min="0" placeholder="不限"></label></section>
<p id="status" class="status"></p><div class="table-wrap"><table><thead><tr><th>项目</th><th>最终成功率</th><th>预计尝试</th><th>总经验</th><th>购买成本</th><th>税前利润</th><th>税后收入</th><th>税后利润/亏损</th><th>每点经验</th><th>资金占用</th><th>成交量</th><th>价差</th><th>风险</th></tr></thead><tbody id="rows"></tbody></table></div><section id="detail" class="detail" hidden></section></section>
<section id="market" class="panel" hidden><h2>市场报价</h2><div class="market-tools"><label>搜索市场物品 <input id="marketSearch" type="search" placeholder="输入物品名或 HRID"></label><span id="marketSummary"></span></div><div class="table-wrap"><table><thead><tr><th>物品</th><th>强化</th><th>最低卖价</th><th>最高买价</th><th>小时均价</th><th>小时成交量</th></tr></thead><tbody id="marketRows"></tbody></table></div></section>
</main><script type="module" src="app.js"></script></body></html>
