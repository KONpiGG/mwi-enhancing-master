<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>强化大师</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><h1>🛠️ 强化大师</h1><p>自动遍历市场中所有可买入等级 → 所有更高可卖出等级</p></div><button id="update">↻ 更新市场数据</button></header>
<nav><button class="tab active" data-panel="projects">强化项目</button><button class="tab" data-panel="market">市场报价</button></nav>
<section id="projects" class="panel"><section class="settings-controls" aria-label="强化筛选"><label class="item-filter">🔎 要强化的装备 <select id="item"><option value="">全部装备</option></select></label><label class="inline-toggle"><input id="manufactureBase" type="checkbox" checked> 🔨 自己制作 +0 装备</label><label class="inline-toggle"><input id="historyValuation" type="checkbox" checked> 📈 使用历史成交价</label></section>
<details class="preset"><summary><span>🎒 强化预设</span><small>点击展开玩家装备与 Buff 设置</small></summary><div class="preset-body"><div class="preset-head"><div><h2>🎒 强化预设</h2><p>预设只保存在本机浏览器，也可下载 JSON 备份；网站不会内置或上传你的预设。</p></div><div class="preset-actions"><select id="savedPreset"><option value="">未保存的预设</option></select><button id="savePreset">保存</button><button id="deletePreset" class="secondary">删除</button><button id="exportPreset" class="secondary">下载</button><button id="importPreset" class="secondary">导入</button><input id="presetFile" type="file" accept="application/json" hidden></div></div><fieldset class="preset-section"><legend>📈 玩家</legend><label>玩家强化等级 <input id="player" type="number" min="0" max="200" value="100"></label><label>房子等级 <input id="houseLevel" type="number" min="0" max="8" value="0"><small>每级：速度 +1%，成功率与经验 +0.05%</small></label></fieldset><fieldset class="preset-section"><legend>🛠️ 强化装备</legend><div id="equipmentSlots" class="slots"></div></fieldset><fieldset><legend>🍵 饮品（可多选）</legend><label><input type="checkbox" name="tea" value="/items/enhancing_tea"> 强化茶</label><label><input type="checkbox" name="tea" value="/items/super_enhancing_tea"> 超级强化茶</label><label><input type="checkbox" name="tea" value="/items/ultra_enhancing_tea"> 究极强化茶</label><label><input type="checkbox" name="tea" value="/items/blessed_tea"> 祝福茶</label><label><input type="checkbox" name="tea" value="/items/wisdom_tea"> 智慧茶</label></fieldset>
<div class="buff-grid"><fieldset><legend>🏘️ 社区 Buff</legend><label><input type="checkbox" id="mooCard"> 哞卡（经验 +5%）</label><label>经验 Buff 等级 <input id="communityExperience" type="number" min="0" max="20" value="0"><small>Lv.1 +20%，每级再 +0.5%</small></label><label>强化速度 Buff 等级 <input id="communitySpeed" type="number" min="0" max="20" value="0"><small>Lv.1 +20%，每级再 +0.5%</small></label></fieldset><fieldset><legend>🏆 成就 Buff</legend><label><input type="checkbox" name="achievement" value="/achievement_tiers/beginner"> 初级（采集 +2%）</label><label><input type="checkbox" name="achievement" value="/achievement_tiers/novice"> 新手（经验 +2%）</label><label><input type="checkbox" name="achievement" value="/achievement_tiers/adept"> 熟练（效率 +2%）</label><label><input type="checkbox" name="achievement" value="/achievement_tiers/veteran"> 老兵（稀有发现 +2%）</label><label><input type="checkbox" name="achievement" value="/achievement_tiers/champion"> 冠军（强化成功率 +0.2%）</label></fieldset><fieldset><legend>⛩️ 神龛</legend><label>力量神龛 <input id="shrinePower" type="number" min="0" value="0"><small>不影响强化</small></label><label>节奏神龛 <input id="shrineRhythm" type="number" min="0" value="0"><small>每级速度 +0.5%</small></label><label>精神神龛 <input id="shrineSpirit" type="number" min="0" value="0"><small>不影响当前利润/经验计算</small></label><label>稀有神龛 <input id="shrineRare" type="number" min="0" value="0"><small>不影响当前利润/经验计算</small></label><label>学者神龛 <input id="shrineScholar" type="number" min="0" value="0"><small>每级经验 +0.5%</small></label></fieldset></div><p id="buffSummary" class="buff-summary"></p></div></details>
<p id="status" class="status"></p><div class="sort-controls"><strong>排序与区间</strong><label>排序字段<select id="primarySort"></select></label><label>排序方向<select id="sortDirection"><option value="desc">由高到低</option><option value="asc">由低到高</option></select></label><label>最低<input id="rangeMin" type="number" placeholder="不限"></label><label>最高<input id="rangeMax" type="number" placeholder="不限"></label><span>区间作用于当前排序字段；也可点击表头快速排序</span></div><div class="table-wrap"><table class="results"><thead><tr><th>项目</th><th><button data-sort="hourlyProfit" title="预计每小时利润">工时费</button></th><th><button data-sort="profit">利润</button></th><th><button data-sort="profitRate">利润率</button></th><th><button data-sort="totalCost">总成本</button></th><th><button data-sort="expectedAttempts">次数</button></th><th><button data-sort="expectedTime">时间</button></th><th><button data-sort="experienceEfficiency">经验效率</button></th><th><button data-sort="marketListingPrice">市场挂单价格</button></th><th><button data-sort="grossSaleRevenue" title="历史成交量加权均价">历史成交估价</button></th><th><button data-sort="historyVolume">历史成交量</button></th><th>流动性 / 等待</th><th><button data-sort="riskScore">风险度</button></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="market" class="panel" hidden><h2>市场报价</h2><div class="market-tools"><label>搜索市场物品 <input id="marketSearch" type="search" placeholder="输入物品名或 HRID"></label><span id="marketSummary"></span></div><div class="table-wrap"><table><thead><tr><th>物品</th><th>强化</th><th>最低卖价</th><th>最高买价</th><th>小时均价</th><th>小时成交量</th></tr></thead><tbody id="marketRows"></tbody></table></div></section>
</main><dialog id="detail"><button id="closeDetail" class="dialog-close" aria-label="关闭">×</button><div id="detailContent"></div></dialog><script type="module" src="app.js"></script></body></html>
