<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>强化大师</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><h1>🛠️ 强化大师</h1><p>自动遍历市场中所有可买入等级 → 所有更高可卖出等级</p></div><button id="update">↻ 更新市场数据</button></header>
<nav><button class="tab active" data-panel="projects">强化项目</button><button class="tab" data-panel="market">市场报价</button></nav>
<section id="projects" class="panel"><h2>⚙️ 强化设置</h2><section class="controls"><label class="wide">🔎 要强化的装备 <select id="item"><option value="">全部装备</option></select></label><label>📈 玩家强化等级 <input id="player" type="number" min="0" max="200" value="100"><small>超过装备推荐等级时，每级 +1% 行动速度；同时影响成功率。</small></label><label>💰 市场手续费（%） <input id="fee" type="number" min="0" max="99.99" step="0.01" value="0"></label><label>↕️ 排序 <select id="sort"><option value="profit">预计利润</option><option value="loss">最低亏损</option><option value="costPerExperience">每点经验成本</option><option value="totalExperience">总经验</option><option value="volume">成交量</option></select></label><label>最低经验 <input id="minXp" type="number" min="0" value="0"></label><label>最大允许亏损 <input id="maxLoss" type="number" min="0" placeholder="不限"></label><label>最低成交量 <input id="minVolume" type="number" min="0" value="0"></label><label>最大资金需求 <input id="maxCapital" type="number" min="0" placeholder="不限"></label></section>
<section class="preset"><div><h2>🎒 强化预设</h2><p>这里选择的是角色实际穿戴，不是手填加成。装备 +N 会按官方强化总加成倍率自动推导属性。</p></div><div id="equipmentSlots" class="slots"></div><fieldset><legend>🍵 饮品（可多选）</legend><label><input type="checkbox" name="tea" value="/items/enhancing_tea"> 强化茶（强化等级 +3、速度 +2%）</label><label><input type="checkbox" name="tea" value="/items/super_enhancing_tea"> 超级强化茶（+6、+4%）</label><label><input type="checkbox" name="tea" value="/items/ultra_enhancing_tea"> 究极强化茶（+8、+6%）</label><label><input type="checkbox" name="tea" value="/items/blessed_tea"> 祝福茶（1% 概率跳升两级）</label><label><input type="checkbox" name="tea" value="/items/wisdom_tea"> 智慧茶（经验 +12%）</label></fieldset><p id="buffSummary" class="buff-summary"></p></section>
<p id="status" class="status"></p><div class="table-wrap"><table><thead><tr><th>项目</th><th>最终成功率</th><th>预计尝试</th><th>总经验</th><th>购买成本</th><th>税前利润</th><th>税后收入</th><th>税后利润/亏损</th><th>每点经验</th><th>资金占用</th><th>成交量</th><th>价差</th><th>风险</th></tr></thead><tbody id="rows"></tbody></table></div><section id="detail" class="detail" hidden></section></section>
<section id="market" class="panel" hidden><h2>市场报价</h2><div class="market-tools"><label>搜索市场物品 <input id="marketSearch" type="search" placeholder="输入物品名或 HRID"></label><span id="marketSummary"></span></div><div class="table-wrap"><table><thead><tr><th>物品</th><th>强化</th><th>最低卖价</th><th>最高买价</th><th>小时均价</th><th>小时成交量</th></tr></thead><tbody id="marketRows"></tbody></table></div></section>
</main><script type="module" src="app.js"></script></body></html>
